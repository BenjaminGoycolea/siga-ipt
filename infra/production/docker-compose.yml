services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in infra/production/.env}
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME in infra/production/.env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in infra/production/.env}
    volumes:
      - siga_database_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - siga
    restart: unless-stopped

  keycloak-database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: ${KEYCLOAK_DB_USERNAME:?Set KEYCLOAK_DB_USERNAME in infra/production/.env}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in infra/production/.env}
    volumes:
      - siga_keycloak_database_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - siga
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-database:5432/keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME:?Set KEYCLOAK_DB_USERNAME in infra/production/.env}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in infra/production/.env}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?Set KEYCLOAK_ADMIN_USERNAME in infra/production/.env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in infra/production/.env}
      KC_HOSTNAME: https://${AUTH_DOMAIN:?Set AUTH_DOMAIN in infra/production/.env}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak-realm:/opt/keycloak/data/import:ro
    depends_on:
      keycloak-database:
        condition: service_healthy
    networks:
      - siga
    restart: unless-stopped

  backend:
    image: ${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME in infra/production/.env}/siga-ipt:backend-${IMAGE_TAG:-latest}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://database:5432/${DB_NAME:?Set DB_NAME in infra/production/.env}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in infra/production/.env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in infra/production/.env}
      KEYCLOAK_ISSUER_URI: https://${AUTH_DOMAIN:?Set AUTH_DOMAIN in infra/production/.env}/realms/siga-ipt
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/siga-ipt/protocol/openid-connect/certs
    depends_on:
      database:
        condition: service_healthy
    networks:
      - siga
    deploy:
      replicas: 3
    restart: unless-stopped

  frontend:
    image: ${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME in infra/production/.env}/siga-ipt:frontend-${IMAGE_TAG:-latest}
    networks:
      - siga
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - siga
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in infra/production/.env}
      AUTH_DOMAIN: ${AUTH_DOMAIN:?Set AUTH_DOMAIN in infra/production/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - siga_caddy_data:/data
      - siga_caddy_config:/config
    depends_on:
      nginx:
        condition: service_started
      keycloak:
        condition: service_started
    networks:
      - siga
    restart: unless-stopped

networks:
  siga:
    driver: bridge

volumes:
  siga_database_data:
  siga_keycloak_database_data:
  siga_caddy_data:
  siga_caddy_config:

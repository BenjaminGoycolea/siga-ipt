spring.application.name=siga-ipt-api
spring.profiles.default=dev
server.port=${SERVER_PORT:8080}

spring.jpa.open-in-view=false
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/siga-ipt}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8081/realms/siga-ipt/protocol/openid-connect/certs}

springdoc.swagger-ui.path=/swagger-ui.html
